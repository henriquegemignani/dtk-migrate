# The Rust equivalent of the ruff hooks this replaced: format, then lint.
#
# `rustfmt.toml` uses unstable options (import grouping and granularity), which
# is why formatting runs on nightly. Everything else builds on stable.
repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo +nightly fmt --
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
